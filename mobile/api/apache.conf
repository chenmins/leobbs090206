ScriptAlias /api/v1 /opt/leobbs-mobile/index.cgi
<Directory /opt/leobbs-mobile>
    Options +ExecCGI
    AcceptPathInfo On
    Require all granted
    PassEnv LEOBBS_MOBILE_PUBLIC_BOARDS
</Directory>

<Directory /var/www/html/m>
    RewriteEngine On
    # Serve the Vue entry point for board and topic paths. Assets use their own URLs.
    RewriteRule ^search/?$ index.html [END]
    RewriteRule ^[1-9][0-9]*(/[1-9][0-9]*)?/?$ index.html [END]
</Directory>

# Redirect only the site root so visitors can still choose either version.
RewriteEngine On
RewriteCond %{REQUEST_URI} ^/$
RewriteRule ^/?$ - [E=LEOBBS_ROOT:1]
Header always merge Vary User-Agent env=LEOBBS_ROOT
Header always set Cache-Control "no-store" env=LEOBBS_ROOT

RewriteCond %{HTTP_USER_AGENT} "Android|iPhone|iPad|iPod|Mobile" [NC]
RewriteRule ^/?$ /m/ [R=302,L]
RewriteRule ^/?$ /cgi-bin/leobbs.htm [R=302,L]
