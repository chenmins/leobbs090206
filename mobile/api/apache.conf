ScriptAlias /api/v1 /opt/leobbs-mobile/index.cgi
<Directory /opt/leobbs-mobile>
    Options +ExecCGI
    AcceptPathInfo On
    Require all granted
    PassEnv LEOBBS_MOBILE_PUBLIC_BOARDS
</Directory>

<Directory /var/www/html/m>
    RewriteEngine On
    # Serve the Vue entry point for board and topic paths. Assets use their own URLs.
    RewriteRule ^search/?$ index.html [END]
    RewriteRule ^[1-9][0-9]*(/[1-9][0-9]*)?/?$ index.html [END]
</Directory>

# Exact aliases keep these endpoints outside the persisted forum tree.
ScriptAliasMatch "^/(robots\.txt|sitemap\.xml)?$" /opt/leobbs-seo/index.cgi
<Directory /opt/leobbs-seo>
    Require all granted
    PassEnv LEOBBS_PUBLIC_ORIGIN
</Directory>

# Revalidate the entry point so it can reference the latest hashed assets.
<Directory /var/www/html/m>
    <Files "index.html">
        Header set Cache-Control "no-cache"
    </Files>
</Directory>

<Directory /var/www/html/m/assets>
    <FilesMatch "-[A-Za-z0-9_-]{8,}\.(js|css)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
</Directory>

# Compress public JSON reads only. The form encoder can return credentials.
<LocationMatch "^/api/v1/(home|search|boards/[0-9]+(/topics/[0-9]+)?)$">
    SetOutputFilter DEFLATE
</LocationMatch>
